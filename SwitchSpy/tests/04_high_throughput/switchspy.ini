[global]
; High throughput test requires deferred mode for performance
mode = relay
visualization = deferred

[connection.throughput_test]
; TCP relay for high-frequency market data
type = tcp
listen_port = 8004
forward_host = 127.0.0.1
forward_port = 9004
metadata_file = tests/04_high_throughput/shared.meta.json

[recording]
enabled = true
output_file = market_data_session.bin
buffer_size = 10485760  ; 10MB buffer for high throughput
