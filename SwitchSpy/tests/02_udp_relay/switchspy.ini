[global]
; SwitchSpy operates in relay mode for UDP
mode = relay
visualization = deferred

[connection.udp_relay_test]
; UDP relay configuration
type = udp
listen_port = 8002
forward_host = 127.0.0.1
forward_port = 9002
metadata_file = tests/02_udp_relay/shared.meta.json

[recording]
enabled = true
output_file = udp_session.bin
buffer_size = 1048576  ; 1MB buffer
