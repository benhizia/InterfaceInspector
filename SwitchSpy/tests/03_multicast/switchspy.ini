[global]
; SwitchSpy operates in passive spy mode for multicast
mode = spy
visualization = deferred

[connection.multicast_test]
; Multicast configuration
type = multicast
multicast_group = 239.255.0.1
multicast_port = 8003
metadata_file = tests/03_multicast/shared.meta.json

; No forwarding needed in spy mode - just monitor

[recording]
enabled = true
output_file = multicast_session.bin
buffer_size = 2097152  ; 2MB buffer for telemetry broadcasts
