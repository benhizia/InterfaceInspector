[global]
mode = relay              # relay, record, replay
visualization = deferred  # realtime, deferred
theme = dark             # dark, light

[recording]
enabled = true
output_dir = ./recordings
auto_save = true
buffer_size = 10485760  # 10MB

# TCP Relay Example
[connection.tcp_relay_1]
type = tcp
listen_port = 8001
forward_host = 192.168.1.100
forward_port = 9001
metadata_file = ../MetaDataGen/01_simple_struct.meta.json

# UDP Relay Example
[connection.udp_relay_1]
type = udp
listen_port = 8002
forward_host = 192.168.1.100
forward_port = 9002
metadata_file = ../MetaDataGen/02_class_with_methods.meta.json

# Multicast Spy Example
[connection.multicast_spy_1]
type = multicast
multicast_group = 239.1.1.1
multicast_port = 5000
metadata_file = ../MetaDataGen/03_inheritance.meta.json

# Another TCP connection
[connection.api_relay]
type = tcp
listen_port = 8080
forward_host = localhost
forward_port = 3000
metadata_file = ../MetaDataGen/04_templates.meta.json

# Replay configuration example
[replay.session_1]
file = ./recordings/session_2024_11_08.bin
mode = multicast_emit
target_group = 239.1.1.1
target_port = 5000
